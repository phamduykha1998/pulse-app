<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#00E5FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PULSE">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%230A0E1A' width='192' height='192'/><text x='96' y='110' font-size='80' font-weight='700' font-family='monospace' fill='%2300E5FF' text-anchor='middle'>P</text></svg>">
<title>PULSE — Time + Energy OS</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <div class="tb-logo">
    <div class="tb-name">PULSE</div>
    <div class="tb-tag">TIME + ENERGY OS</div>
  </div>
  <div class="tb-right">
    <button class="tb-btn" id="exportBtn" title="Export JSON">⬇</button>
    <button class="tb-btn" id="settingsBtn" title="Settings">⚙</button>
  </div>
</header>

<!-- NAV TABS -->
<nav class="nav">
  <button class="nav-btn on" data-tab="input">
    <span class="nav-i">◉</span><span>LOG</span>
  </button>
  <button class="nav-btn" data-tab="daily">
    <span class="nav-i">▣</span><span>DAY</span>
  </button>
  <button class="nav-btn" data-tab="weekly">
    <span class="nav-i">▦</span><span>WEEK</span>
  </button>
  <button class="nav-btn" data-tab="monthly">
    <span class="nav-i">▩</span><span>MONTH</span>
  </button>
</nav>

<main class="content">

<!-- ═══════════ TAB: INPUT ═══════════ -->
<section class="page on" id="page-input">
  <div class="page-head">
    <h1 class="page-title">Daily Log</h1>
    <p class="page-sub" id="todayLabel">—</p>
  </div>

  <div class="date-bar">
    <button class="date-nav" id="dateBack">‹</button>
    <input type="date" id="logDate" class="date-input">
    <button class="date-nav" id="dateFwd">›</button>
  </div>

  <div class="input-grid" id="inputGrid">
    <!-- Auto-generated -->
  </div>

  <div id="qualityWrap"></div>

  <button class="btn-save" id="saveBtn">SAVE LOG</button>

  <div class="quick-stats" id="quickStats"></div>
</section>

<!-- ═══════════ TAB: DAILY ═══════════ -->
<section class="page" id="page-daily">
  <div class="page-head">
    <h1 class="page-title">Reality Mirror</h1>
    <p class="page-sub" id="dailyLabel">—</p>
  </div>

  <div class="date-bar">
    <button class="date-nav" id="dailyBack">‹</button>
    <input type="date" id="dailyDate" class="date-input">
    <button class="date-nav" id="dailyFwd">›</button>
  </div>

  <div id="dailyContent"></div>
</section>

<!-- ═══════════ TAB: WEEKLY ═══════════ -->
<section class="page" id="page-weekly">
  <div class="page-head">
    <h1 class="page-title">Weekly View</h1>
    <p class="page-sub" id="weeklyLabel">—</p>
  </div>

  <div class="date-bar">
    <button class="date-nav" id="weekBack">‹</button>
    <span class="week-range" id="weekRange">—</span>
    <button class="date-nav" id="weekFwd">›</button>
  </div>

  <div id="weeklyContent"></div>
</section>

<!-- ═══════════ TAB: MONTHLY ═══════════ -->
<section class="page" id="page-monthly">
  <div class="page-head">
    <h1 class="page-title">Monthly View</h1>
    <p class="page-sub" id="monthlyLabel">—</p>
  </div>

  <div class="date-bar">
    <button class="date-nav" id="monthBack">‹</button>
    <span class="week-range" id="monthRange">—</span>
    <button class="date-nav" id="monthFwd">›</button>
  </div>

  <div id="monthlyContent"></div>
</section>

</main>

<!-- ═══════════ MODAL: SETTINGS ═══════════ -->
<div class="modal" id="settingsModal">
  <div class="modal-panel">
    <div class="modal-head">
      <h2>Settings — Targets</h2>
      <button class="modal-close" id="closeSettings">×</button>
    </div>
    <div class="modal-body">
      <p class="modal-hint">Set daily target (hours) for each pillar.</p>
      <div id="settingsGrid"></div>

      <div class="modal-section">
        <h3>Data</h3>
        <button class="btn-ghost" id="importBtn">⬆ Import JSON</button>
        <input type="file" id="importFile" accept=".json" hidden>
        <button class="btn-ghost danger" id="resetBtn">⟲ Reset all data</button>
      </div>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="logic.js"></script>
<script>
/* PWA Service Worker Register */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('data:application/javascript,' + encodeURIComponent(`
    const CACHE='pulse-v2';
    const FILES=['/','index.html','style.css','logic.js','manifest.json'];
    self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(FILES)).catch(()=>{})));
    self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)).catch(()=>caches.match('index.html'))));
  `)).catch(()=>{});
}
</script>
</body>
</html>

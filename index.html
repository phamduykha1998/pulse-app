<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#00E5FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PULSE">
<link rel="manifest" href="manifest.json">
<title>PULSE — Hệ thống Thời gian & Năng lượng</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="tb-logo">
    <div class="tb-name">PULSE</div>
    <div class="tb-tag">THỜI GIAN + NĂNG LƯỢNG</div>
  </div>
  <div class="tb-right">
    <button class="tb-btn" id="exportBtn" title="Xuất JSON">⬇</button>
    <button class="tb-btn" id="settingsBtn" title="Cài đặt">⚙</button>
  </div>
</header>

<nav class="nav">
  <button class="nav-btn on" data-tab="input"><span class="nav-i">◉</span><span>NHẬT KÝ</span></button>
  <button class="nav-btn" data-tab="daily"><span class="nav-i">▣</span><span>NGÀY</span></button>
  <button class="nav-btn" data-tab="weekly"><span class="nav-i">▦</span><span>TUẦN</span></button>
  <button class="nav-btn" data-tab="monthly"><span class="nav-i">▩</span><span>THÁNG</span></button>
</nav>

<main class="content">

<!-- TAB: NHẬT KÝ -->
<section class="page on" id="page-input">
  <div class="page-head">
    <div class="page-head-row">
      <h1 class="page-title">Nhật Ký</h1>
      <a class="today-link" id="todayLink" style="display:none">← Hôm nay</a>
    </div>
    <p class="page-sub" id="todayLabel">—</p>
  </div>
  <div class="date-bar">
    <button class="date-nav" id="dateBack">‹</button>
    <input type="date" id="logDate" class="date-input">
    <button class="date-nav" id="dateFwd">›</button>
  </div>
  <div class="input-grid" id="inputGrid"></div>
  <div id="qualityWrap"></div>
  <button class="btn-save" id="saveBtn">LƯU NHẬT KÝ</button>
  <div class="quick-stats" id="quickStats"></div>
</section>

<!-- TAB: NGÀY -->
<section class="page" id="page-daily">
  <div class="page-head">
    <div class="page-head-row">
      <h1 class="page-title">Gương Thực Tế</h1>
      <a class="today-link" id="dailyTodayLink" style="display:none">← Hôm nay</a>
    </div>
    <p class="page-sub" id="dailyLabel">—</p>
  </div>
  <div class="date-bar">
    <button class="date-nav" id="dailyBack">‹</button>
    <input type="date" id="dailyDate" class="date-input">
    <button class="date-nav" id="dailyFwd">›</button>
  </div>
  <div id="dailyContent"></div>
</section>

<!-- TAB: TUẦN -->
<section class="page" id="page-weekly">
  <div class="page-head">
    <h1 class="page-title">Tuần</h1>
    <p class="page-sub" id="weeklyLabel">—</p>
  </div>
  <div class="date-bar">
    <button class="date-nav" id="weekBack">‹</button>
    <span class="week-range" id="weekRange">—</span>
    <button class="date-nav" id="weekFwd">›</button>
  </div>
  <div id="weeklyContent"></div>
</section>

<!-- TAB: THÁNG -->
<section class="page" id="page-monthly">
  <div class="page-head">
    <h1 class="page-title">Tháng</h1>
    <p class="page-sub" id="monthlyLabel">—</p>
  </div>
  <div class="date-bar">
    <button class="date-nav" id="monthBack">‹</button>
    <span class="week-range" id="monthRange">—</span>
    <button class="date-nav" id="monthFwd">›</button>
  </div>
  <div id="monthlyContent"></div>
</section>

</main>

<!-- MODAL: CÀI ĐẶT -->
<div class="modal" id="settingsModal">
  <div class="modal-panel">
    <div class="modal-head">
      <h2>Cài đặt — Mục tiêu</h2>
      <button class="modal-close" id="closeSettings">×</button>
    </div>
    <div class="modal-body">
      <p class="modal-hint">Đặt mục tiêu hàng ngày (giờ) cho từng trụ cột.</p>
      <div id="settingsGrid"></div>
      <div class="modal-section">
        <h3>Dữ liệu</h3>
        <button class="btn-ghost" id="importBtn">⬆ Nhập JSON</button>
        <input type="file" id="importFile" accept=".json" hidden>
        <button class="btn-ghost danger" id="resetBtn">⟲ Xoá tất cả dữ liệu</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: PHONE ALERT -->
<div class="modal" id="phoneAlertModal">
  <div class="modal-panel alert-panel">
    <div class="modal-head alert-head">
      <h2>⚠ Cảnh báo điện thoại</h2>
      <button class="modal-close" onclick="dismissPhoneAlert()">×</button>
    </div>
    <div class="modal-body" id="phoneAlertBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="logic.js"></script>
</body>
</html>
